name: CI

# Standard CI for noy-db-on: the @noy-db/on-* unlock and auth primitives — an `on-`
# package is a way to GET ON (prove who you are, yield key material), never a place
# data goes; `to-` is the storage prefix and lives in noy-db / noy-db-to.
# Multi-package pnpm workspace: check:architecture → install → build → lint → typecheck → test
# across the runtime-supported Node versions (22 + 24).

on:
  push:
    branches: [main]
  # ⚠️ NO `branches:` filter here, deliberately. For `pull_request` that key
  # filters on the BASE branch, so `branches: [main]` silently skips every PR
  # stacked on another branch — and GitHub then reports "no checks reported",
  # which renders as pending and is indistinguishable from never-ran.
  # noy-db-docs shipped a stacked PR whose green came from a hand dispatch.
  # `push` stays pinned to main so this does not double-run per branch.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Lint + typecheck ─────────────────────────────────────────────────
  quality:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Architecture invariants
        run: pnpm check:architecture
      # Catches a dependency a package USES but never DECLARES. The test suite
      # cannot: a sibling declaring it satisfies pnpm's store, so the suite goes
      # green either way (measured). Only a static check sees it.
      - name: Every package declares what it uses
        run: pnpm check:declared-deps

      # Guards a PARTIAL bump: one version across all nine packages, every
      # lockstep @noy-db/* range uniform, and each exact dev pin admitted by the
      # peer range declared beside it. All four are invisible to the suite,
      # which resolves workspace source and never has to satisfy a published
      # range (that is the #1228 shape: locally correct, green everywhere, an
      # ERESOLVE for the consumer).
      #
      # ⚠️ check:not-already-published is deliberately NOT here. It asks npm
      # whether the version in the manifests already exists, which is TRUE for
      # every commit between a publish and the next bump — correct as a release
      # pre-flight, permanently red as a PR gate. It runs in release.yml.
      - name: One version across the repo, lockstep ranges uniform
        run: pnpm check:versions-uniform
      # This repo answers for the codemod rows naming ITS packages. hub shipped
      # them and can no longer check them — the packages moved here, so the
      # obligation did too. Nothing compiles a migration map.
      - name: Codemod rows agree with this repo's source
        run: pnpm check:codemod-rows
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck

  # ── Build (once) ─────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build

  # ── Test matrix (runtime-supported Node versions) ────────────────────
  test:
    name: Test (node ${{ matrix.node }})
    needs: [quality, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node${{ matrix.node }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-node${{ matrix.node }}-pnpm-
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test
